<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CyberShield.AI — דור העתיד של אבטחת ענן</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#07091A] text-slate-100 min-h-screen flex flex-col antialiased">

  <!-- Ambient glow — Tailwind blur + animate-pulse -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden">
    <div class="absolute -top-40 -right-20 w-[560px] h-[560px] bg-indigo-700 rounded-full blur-[130px] opacity-20 animate-pulse"></div>
    <div class="absolute -bottom-40 -left-20 w-[440px] h-[440px] bg-cyan-600 rounded-full blur-[110px] opacity-20 animate-pulse" style="animation-delay:2s"></div>
  </div>

  <!-- Main -->
  <main class="flex-1 flex items-center justify-center px-6 py-20 relative z-10">
    <div class="w-full max-w-md text-center">

      <!-- Live badge -->
      <div class="inline-flex items-center gap-2 border border-indigo-500/40 bg-indigo-500/10 rounded-full px-4 py-1.5 text-xs font-semibold text-indigo-300 mb-10 tracking-wide">
        <span class="relative flex h-2 w-2">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyan-400 opacity-75"></span>
          <span class="relative inline-flex h-2 w-2 rounded-full bg-cyan-400"></span>
        </span>
        גרסת בטא מוקדמת &nbsp;·&nbsp; הרשמה חינם
      </div>

      <!-- Shield icon -->
      <div class="flex justify-center mb-8">
        <div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-indigo-600 to-cyan-500 flex items-center justify-center shadow-2xl shadow-indigo-600/40">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z"/>
          </svg>
        </div>
      </div>

      <!-- Brand -->
      <p class="text-indigo-400 tracking-[0.22em] text-xs font-bold uppercase mb-4">CyberShield.AI</p>

      <!-- Headline -->
      <h1 class="text-5xl sm:text-6xl font-black leading-[1.05] mb-5 text-white">
        דור העתיד של<br>
        <span class="bg-gradient-to-r from-cyan-400 to-indigo-400 bg-clip-text text-transparent">אבטחת ענן</span>
      </h1>

      <!-- Sub -->
      <p class="text-slate-400 text-base leading-relaxed mb-10">
        הגנה מבוססת AI על תשתיות ענן — בזמן אמת.<br>
        פשוטה להטמעה. קשה לפריצה.
      </p>

      <!-- Form card -->
      <div class="bg-slate-900/50 border border-slate-700/40 backdrop-blur-sm rounded-2xl p-5 mb-6">
        <form id="wlForm" class="flex flex-col gap-3" novalidate>
          <input
            type="email"
            id="emailField"
            placeholder="your@company.com"
            required
            dir="ltr"
            aria-label="כתובת אימייל"
            class="bg-slate-800/70 border border-slate-600/50 rounded-xl px-4 py-3 text-slate-200 placeholder-slate-500 text-sm text-center focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500/50 transition-all duration-200 w-full"
          />
          <button
            type="submit"
            id="wlBtn"
            class="w-full bg-gradient-to-r from-indigo-600 to-cyan-500 hover:from-indigo-500 hover:to-cyan-400 text-white font-bold py-3 rounded-xl text-sm transition-all duration-200 hover:scale-105 hover:shadow-lg hover:shadow-indigo-500/30"
          >
            הצטרף לרשימת המתנה ←
          </button>
        </form>
        <p class="text-slate-600 text-xs mt-3">ללא ספאם · גישה מוקדמת לחברות נבחרות בלבד</p>
      </div>

      <!-- Social proof -->
      <p class="text-slate-500 text-sm">
        <span class="text-slate-300 font-semibold">240+</span> חברות כבר ממתינות לגישה
      </p>

    </div>
  </main>

  <!-- Footer -->
  <footer class="relative z-10 pb-6 text-center text-slate-600 text-xs">
    &copy; 2026 CyberShield.AI &nbsp;·&nbsp; תל אביב, ישראל
  </footer>

  <script>
    document.getElementById('wlForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var btn = document.getElementById('wlBtn');
      var input = document.getElementById('emailField');
      if (!input.value) return;
      btn.textContent = '✓ נרשמת בהצלחה — נחזור אליך בקרוב';
      btn.classList.remove('from-indigo-600', 'to-cyan-500', 'hover:from-indigo-500', 'hover:to-cyan-400', 'hover:shadow-indigo-500/30');
      btn.classList.add('from-emerald-600', 'to-green-500', 'cursor-default');
      btn.disabled = true;
      input.disabled = true;
    });
  </script>

</body>
</html>
